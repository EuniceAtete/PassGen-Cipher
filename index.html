<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UV Ledger — Password Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- film-grain / UV scan texture, sits behind everything -->
  <svg class="grain" aria-hidden="true">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"/>
  </svg>

  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <main class="card">
    <div class="scan-sweep" aria-hidden="true"></div>

    <header class="card-head">
      <div class="brand">
        <svg class="lamp-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 3H16L14.5 9H9.5L8 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9.5 9L7 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M14.5 9L17 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6 21H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h1 class="wordmark" data-text="UV Ledger">UV Ledger</h1>
      </div>
      <p class="subtitle">Passwords revealed only under the right light.</p>
    </header>

    <section class="entry" aria-label="Generated password">
      <div class="entry-label">
        <span>Entry</span>
        <span class="entry-tag">№ 0001</span>
      </div>
      <div class="output-box">
        <span id="password-output" class="placeholder">Nothing revealed yet.</span>
        <button class="copy-btn" id="copy-btn" type="button" aria-label="Copy password" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6 15H4.5C3.67 15 3 14.33 3 13.5V4.5C3 3.67 3.67 3 4.5 3H13.5C14.33 3 15 3.67 15 4.5V6" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
      </div>
      <div class="status-row">
        <span id="copy-msg" aria-live="polite">Copied to clipboard</span>
        <div class="strength" id="strength-wrap">
          <span class="strength-caption">Exposure</span>
          <div class="strength-bars" id="strength-bars">
            <span></span><span></span><span></span><span></span>
          </div>
          <span id="strength-label">—</span>
        </div>
      </div>
    </section>

    <section class="field">
      <div class="field-label-row">
        <label for="length-slider">Length</label>
        <span id="length-value">16</span>
      </div>
      <input type="range" id="length-slider" min="8" max="32" value="16">
    </section>

    <section class="options">
      <div class="toggle-row">
        <span class="label">Lowercase</span>
        <span class="hint">a–z</span>
        <label class="vial">
          <input type="checkbox" id="opt-lowercase" checked>
          <span class="vial-track"></span>
          <span class="vial-fill"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">Uppercase</span>
        <span class="hint">A–Z</span>
        <label class="vial">
          <input type="checkbox" id="opt-uppercase" checked>
          <span class="vial-track"></span>
          <span class="vial-fill"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">Numbers</span>
        <span class="hint">0–9</span>
        <label class="vial">
          <input type="checkbox" id="opt-numbers" checked>
          <span class="vial-track"></span>
          <span class="vial-fill"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="label">Symbols</span>
        <span class="hint">!@#$</span>
        <label class="vial">
          <input type="checkbox" id="opt-symbols">
          <span class="vial-track"></span>
          <span class="vial-fill"></span>
        </label>
      </div>
    </section>

    <p class="error-msg" id="error-msg">Turn on at least one character type.</p>

    <div class="actions">
      <button class="primary" id="generate-btn" type="button">Reveal password</button>
      <button class="secondary" id="clear-btn" type="button">Clear ledger</button>
    </div>

    <div class="stamp" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4"/>
        <text x="50" y="46" text-anchor="middle" class="stamp-text">UV·16</text>
        <text x="50" y="60" text-anchor="middle" class="stamp-sub">LEDGER</text>
      </svg>
    </div>
  </main>

</body>
</html>
